# Refreshes the Profile Views / Followers / Stars pills and renders the
# Contribution Activity graph and GitHub Trophies cards into assets/.
# Optional: add a classic token with `read:user` as the PROFILE_TOKEN secret
# so private contributions are counted too.
name: Update profile cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/templates/**, scripts/**, .github/workflows/counters.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_counters.py
      - name: Render activity graph and trophies
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_widgets.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/counter-*.svg assets/*activity-*.svg assets/*trophies-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
